name: Recompute Package.resolved originHash

on:
  pull_request:
    paths:
      - "NowPlayingPackage/Package.swift"
      - "NowPlaying.xcworkspace/xcshareddata/swiftpm/Package.resolved"

jobs:
  recompute:
    uses: nnsnodnb/.github/.github/workflows/recompute-package-resolved.yml@02e00e0430cbf7b7303ecef17debfbbe49e358ac
    with:
      runs-on: xcode-27
      developer-dir: /Applications/Xcode_27.2.0.app/Contents/Developer
      workspace: NowPlaying.xcworkspace
      scheme: NowPlaying
      package-resolved: NowPlaying.xcworkspace/xcshareddata/swiftpm/Package.resolved
    secrets:
      client-id: ${{ secrets.AOI_CHAN_BOT_CLIENT_ID }}
      app-private-key: ${{ secrets.AOI_CHAN_BOT_PRIVATE_KEY }}
    permissions:
      contents: read
      pull-requests: read
