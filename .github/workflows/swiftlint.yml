name: SwiftLint

on:
  pull_request:
    paths:
      - ".github/workflows/swiftlint.yml"
      - ".swiftlint.yml"
      - "**/*.swift"

jobs:
  swiftlint:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: nnsnodnb/action-swiftlint@v1.0.0
        with:
          github_token: ${{ secrets.github_token }}
          workdir: NowPlayingPackage
          reporter: github-pr-review
          level: warning
          fail_level: error
